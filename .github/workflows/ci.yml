name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image pinned: ubuntu-latest is moving to a new release, and the E2E
# job installs browser system packages that must exist for it.
jobs:
  quality:
    name: Typecheck · Lint · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Node 20 is the .nvmrc baseline; 22 is the current LTS. Tests once passed
    # only on the newest Node and broke CI on 20 — both run now.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Internal links and dead buttons
        run: npm run check:links && npm run check:buttons

      - name: Build
        run: npm run build
        env:
          # Provide placeholder so the build never fails on a missing key.
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload build artifact
        if: matrix.node == '20'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  emulator:
    name: Firestore rules · store (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # The Firestore and Storage emulators run on the JVM.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.2

      - name: Cache emulator downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.2

      # Security rules (who may read and write what) and the server's Firestore
      # store, against real emulators instead of mocks.
      - name: Rules and store tests
        run: npm run test:emulator
